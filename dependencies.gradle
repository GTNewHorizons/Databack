
minecraft {
    mainLwjglVersion = 3
    lwjgl3Version = "3.4.2"
}

dependencies {
    implementation("com.github.GTNewHorizons:GTNHLib:99.99.99-dev:dev")
    implementation("com.github.GTNewHorizons:MCGPU:v0.1.0:dev") {
        exclude group: "com.github.GTNewHorizons", module: "GTNHLib"
    }

    compileOnly("org.ow2.asm:asm:5.0.3")
    compileOnly("org.jetbrains:annotations:26.0.2")
    compileOnly('org.projectlombok:lombok:1.18.34')
    annotationProcessor('org.projectlombok:lombok:1.18.34')

    runtimeOnlyNonPublishable("com.github.GTNewHorizons:NotEnoughItems:2.8.111-GTNH:dev")

//    runtimeOnlyNonPublishable("com.cardinalstar.cubicchunks:CC2:99.99.99:dev")

    testImplementation("com.github.GTNewHorizons:GTNHLib:99.99.99-dev:dev")
    testRuntimeOnly("it.unimi.dsi:fastutil:8.5.15")
    testCompileOnly("org.jetbrains:annotations:26.0.2")
    testCompileOnly("org.projectlombok:lombok:1.18.34")

    testImplementation(platform("org.junit:junit-bom:5.11.4"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher") {
        because("Only needed to run tests in a version of IntelliJ IDEA that bundles older versions")
    }
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine")
    testRuntimeOnly("org.junit.vintage:junit-vintage-engine")

    afterEvaluate {
        dependencies {
            testImplementation(platform('org.junit:junit-bom:5.14.1'))
            testImplementation('org.junit.jupiter:junit-jupiter')
            testImplementation("org.mockito:mockito-core:3.+")
            testAnnotationProcessor("com.github.bsideup.jabel:jabel-javac-plugin:1.0.1")

            testImplementation('org.junit.platform:junit-platform-engine')
            testImplementation('org.junit.platform:junit-platform-reporting')
            testImplementation('org.junit.platform:junit-platform-launcher')
        }
    }
}

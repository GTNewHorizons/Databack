
minecraft {
    mainLwjglVersion = 3
    lwjgl3Version = "3.4.2"
}

dependencies {
    implementation("com.github.GTNewHorizons:GTNHLib:0.11.54:dev")
    implementation("com.github.GTNewHorizons:ModularUI2:2.3.93-1.7.10:dev")

    implementation("ganymedes01.etfuturum:Et-Futurum-Requiem:2.6.64-GTNH:dev")

    shadowImplementation("org.tomlj:tomlj:1.1.1")

    compileOnly("com.github.GTNewHorizons:lwjgl3ify:3.0.40:dev")
    compileOnly("org.lwjgl:lwjgl:3.4.2")

    compileOnly("org.ow2.asm:asm:5.0.3")
    // Optional: wider biome ids (see ChunkBiomes).
    compileOnly("com.falsepattern:endlessids-mc1.7.10:1.7.3:dev") { transitive = false }
    compileOnly("org.jetbrains:annotations:26.0.2")
    compileOnly('org.projectlombok:lombok:1.18.34')
    annotationProcessor('org.projectlombok:lombok:1.18.34')

    runtimeOnlyNonPublishable("com.github.GTNewHorizons:NotEnoughItems:2.8.170-GTNH:dev")

    compileOnly("com.cardinalstar.cubicchunks:CubicChunks1710:v0.1.26-alpha:dev") { transitive = false }
    // Uncomment to run with Cubic Chunks
//    runtimeOnlyNonPublishable("com.cardinalstar.cubicchunks:CubicChunks1710:v0.1.26-alpha:dev")

    testImplementation("com.github.GTNewHorizons:GTNHLib:0.11.54:dev")
    testRuntimeOnly("it.unimi.dsi:fastutil:8.5.15")
    testCompileOnly("org.jetbrains:annotations:26.0.2")
    testCompileOnly("org.projectlombok:lombok:1.18.34")

    testImplementation(platform("org.junit:junit-bom:5.11.4"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher") {
        because("Only needed to run tests in a version of IntelliJ IDEA that bundles older versions")
    }
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine")
    testRuntimeOnly("org.junit.vintage:junit-vintage-engine")

    afterEvaluate {
        dependencies {
            testImplementation(platform('org.junit:junit-bom:5.14.1'))
            testImplementation('org.junit.jupiter:junit-jupiter')
            testImplementation("org.mockito:mockito-core:3.+")
            testAnnotationProcessor("com.github.bsideup.jabel:jabel-javac-plugin:1.0.1")

            testImplementation('org.junit.platform:junit-platform-engine')
            testImplementation('org.junit.platform:junit-platform-reporting')
            testImplementation('org.junit.platform:junit-platform-launcher')
        }
    }
}
